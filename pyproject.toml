[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "aion-clinical"
version = "1.10.3"
description = "Formal temporal and causal structure for consistent clinical data across systems (HL7 v2, FHIR, MLLP). EUPL-1.2 / commercial dual license."
readme = "README.md"
license = { text = "EUPL-1.2" }
requires-python = ">=3.10"
authors = [
    { name = "Friedhelm Matten", email = "licensing@iscad-it.de" },
]
maintainers = [
    { name = "ISCaD GmbH", email = "licensing@iscad-it.de" },
]
keywords = [
    "clinical", "healthcare", "medical-informatics",
    "ontology", "causal-inference", "temporal-logic",
    "fhir", "hl7", "mllp",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Healthcare Industry",
    "Intended Audience :: Science/Research",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: European Union Public Licence 1.2 (EUPL 1.2)",
    "Operating System :: POSIX :: Linux",
    "Operating System :: MacOS",
    "Operating System :: Microsoft :: Windows",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Medical Science Apps.",
    "Topic :: Scientific/Engineering :: Information Analysis",
    "Typing :: Typed",
]

# Core hat NUR diese zwei Dependencies (numpy ist optional für Monte-Carlo)
dependencies = [
    "PyYAML>=6.0",
]

[project.optional-dependencies]
numeric = ["numpy>=1.24"]
gui     = ["PySide6>=6.5"]  # LGPL-lizenziert, frei für jede Nutzung
fhir    = ["fhir.resources>=7.0"]
causal  = ["dowhy>=0.11", "numpy>=1.24", "pandas>=2.0"]
dowhy   = ["dowhy>=0.11", "numpy>=1.24", "pandas>=2.0"]  # Alias für causal
notebook = ["jupyter>=1.0", "ipython>=8.0", "matplotlib>=3.5", "networkx>=3.0"]
api     = ["fastapi>=0.100", "uvicorn>=0.22"]
verify  = ["z3-solver>=4.12"]  # SMT-Solver für aion.verify.z3_plugin
ldap    = ["ldap3>=2.9"]  # für aion.auth.ldap_backend
oidc    = ["authlib>=1.3", "requests>=2.31"]  # für aion.auth.oidc
dev     = ["pytest>=7.4", "pytest-cov>=4.1", "ruff>=0.1.0", "mypy>=1.5"]
all     = ["aion-clinical[numeric,gui,fhir,causal,api,verify,ldap,oidc]"]

[project.scripts]
aion = "aion.cli:main"
aion-gui = "aion.gui.app:main"

[project.urls]
# Stand 1.10.2: Codeberg hostet das Initial-Concept-Repo (FM-3).
# Aktuelle Software-Distribution ist PyPI.
"Source"                  = "https://codeberg.org/iscad/aion"
"PyPI"                    = "https://pypi.org/project/aion-clinical/"
"Changelog"               = "https://pypi.org/project/aion-clinical/#history"
"Theoretical Foundation"  = "https://doi.org/10.5281/zenodo.19548857"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"aion" = ["py.typed"]
"aion.schemas" = ["*.yaml"]
"aion.examples" = ["*.ipynb"]
"aion.examples.fixtures" = ["**/*.hl7"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = "test_*.py"
addopts = "-ra -q"

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.mypy]
python_version = "3.10"
strict = false
ignore_missing_imports = true
