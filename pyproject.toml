[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "aion-clinical"
version = "2.0.6"
description = "FM-3 formal knowledge representation for clinical trajectories — Allen algebra, causal inference, Shapley attribution, HL7 v2, FHIR R4, differential privacy. AGPL-3.0 / commercial dual license."
readme = "README.md"
license = "AGPL-3.0-only OR LicenseRef-ISCaD-Commercial"
requires-python = ">=3.10"
authors = [
    { name = "Friedhelm Matten", email = "licensing@iscad-it.de" },
]
maintainers = [
    { name = "ISCaD GmbH", email = "licensing@iscad-it.de" },
]
keywords = [
    "clinical", "healthcare", "medical-informatics",
    "ontology", "causal-inference", "temporal-logic",
    "fhir", "hl7", "mllp",
    "differential-privacy", "federated-learning",
    "explainable-ai", "shapley", "AION",
]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Healthcare Industry",
    "Intended Audience :: Science/Research",
    "Intended Audience :: Developers",
    "Operating System :: POSIX :: Linux",
    "Operating System :: MacOS",
    "Operating System :: Microsoft :: Windows",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Medical Science Apps.",
    "Topic :: Scientific/Engineering :: Information Analysis",
    "Typing :: Typed",
]

# Core - sehr leicht (nur PyYAML)
dependencies = [
    "PyYAML>=6.0",
]

[project.optional-dependencies]
# ── Bestehende Extras aus 1.10.3 (unverändert) ──────────────────
numeric = ["numpy>=1.24"]
gui     = ["PySide6>=6.5"]
fhir    = ["fhir.resources>=7.0"]
causal  = ["dowhy>=0.11", "numpy>=1.24", "pandas>=2.0"]
dowhy   = ["dowhy>=0.11", "numpy>=1.24", "pandas>=2.0"]
notebook = ["jupyter>=1.0", "ipython>=8.0", "matplotlib>=3.5", "networkx>=3.0"]
verify  = ["z3-solver>=4.12"]
ldap    = ["ldap3>=2.9"]
oidc    = ["authlib>=1.3", "requests>=2.31"]
dev     = ["pytest>=7.4", "pytest-cov>=4.1", "ruff>=0.1.0", "mypy>=1.5"]

# ── NEU in 2.0.1: FastAPI REST-API ──────────────────────────────
# Erweitert das bestehende `api`-Extra (1.10.3 hatte nur fastapi+uvicorn)
api = [
    "fastapi>=0.110",
    "uvicorn[standard]>=0.27",
    "pydantic>=2.6",
    "python-multipart>=0.0.9",
]

# ── NEU in 2.0.1: weitere Backends ──────────────────────────────
postgres        = ["asyncpg>=0.29"]
mllp            = ["redis>=5.0"]
monitoring      = ["prometheus_client>=0.20"]
oidc-keycloak   = ["python-jose[cryptography]>=3.3"]
federation      = []

# ── Sammel-Extras ───────────────────────────────────────────────
all     = ["aion-clinical[numeric,gui,fhir,causal,api,verify,ldap,oidc]"]
full    = ["aion-clinical[api,postgres,mllp,oidc-keycloak,monitoring,fhir]"]

[project.scripts]
aion = "aion.cli:main"
aion-gui = "aion.gui.app:main"

[project.urls]
"Homepage"                = "https://github.com/fmatten/aion"
"Source"                  = "https://github.com/fmatten/aion"
"Mirror"                  = "https://codeberg.org/iscad/aion"
"PyPI"                    = "https://pypi.org/project/aion-clinical/"
"Changelog"               = "https://github.com/fmatten/aion/blob/master/CHANGELOG.md"
"Theoretical Foundation"  = "https://doi.org/10.5281/zenodo.19553130"
"Issues"                  = "https://github.com/fmatten/aion/issues"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"aion" = ["py.typed"]
"aion.schemas" = ["*.yaml"]
"aion.examples" = ["*.ipynb"]
"aion.examples.fixtures" = ["**/*.hl7"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = "test_*.py"
addopts = "-ra -q"

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.mypy]
python_version = "3.10"
strict = false
ignore_missing_imports = true
